palette = "noctalia"
# Prompt.
#
# Read through $STARSHIP_CONFIG, which terminal/fish.nix points at this file —
# it is not in ~/.config.
#
# --- Why it looks like this ---
#
# The palette is not fixed. Noctalia derives it from the wallpaper, the
# wallpaper rotates every 900s, and the scheme is m3-monochrome — which means
# every ANSI colour lands somewhere in greyscale except red, the one slot that
# keeps a hue. Styling by hue therefore does not work here: "blue" and "purple"
# both render as the same grey, and a prompt that separated fields by colour
# would lose its structure entirely.
#
# So this leans on what stays legible whatever the wallpaper is:
#
#   luminance   bold white for the directory (the anchor), bright-black for
#               everything secondary. Contrast survives any palette.
#   symbols     !3 +1 ⇡2 carry their meaning in the glyph, not the colour.
#   shape       ❯ on success, ✗ on failure — a *different character*, not the
#               same one recoloured, so it reads even if red collapses to grey.
#
# --- What it shows ---
#
# Left, on its own line so the cursor always sits at the same column:
#   directory · branch · git status · nix shell
#
# Right, and only when it matters:
#   command duration (over 2s) · exit code (on failure)
#
# git_status is the reason this was worth rewriting. The previous config
# defined it — with emoji — and then never drew it, because $git_status was
# absent from the format string. Fourteen modules were configured; four were
# displayed.
#
# `palette = "noctalia"` and the block at the bottom are written by Noctalia's
# starship template and must not be edited by hand.
add_newline = false

format = """
$directory$git_branch$git_status$nix_shell
$character"""

# Duration and failure go on the right: relevant after the fact, never in the
# way while typing.
right_format = """$cmd_duration$status"""

[directory]
# The brightest thing on the line — it is what the eye looks for first.
style = "bold white"
# Truncated to the repository root rather than to a fixed depth, so inside a
# project you see the project and not the path leading to it.
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "red"

[git_branch]
style = "bright-black"
symbol = "󰘬 "
format = "[$symbol$branch]($style) "

[git_status]
# The whole point of the rewrite. Reads as e.g. !2+1⇡3 — two files modified,
# one staged, three commits not pushed. Counts rather than bare symbols:
# "there are changes" is much less useful than "there are two".
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nix_shell]
# Which devshell is active. The projects in ~/Projects enter different ones
# through direnv and one has pnpm where the other has Rust, so this is worth
# seeing before running a package manager.
symbol = "❄ "
style = "bright-black"
format = "[$symbol$name]($style) "
heuristic = true

[cmd_duration]
# 2s, not 0. The previous config printed "0s" after every command, which is
# noise; at this threshold it only appears for things that actually took time —
# a nixos-rebuild, a pnpm install.
min_time = 2000
style = "bright-black"
format = "[$duration]($style)"

[status]
disabled = false
style = "red"
symbol = "✘"
format = " [$symbol$status]($style)"

[character]
# Different glyphs, not one glyph in two colours. Red is the only hue the
# monochrome scheme preserves, and relying on it alone would break the moment
# the palette changes.
success_symbol = "[❯](bold white)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[❮](bold white)"

# >>> NOCTALIA STARSHIP PALETTE >>>
