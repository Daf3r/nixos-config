################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#
# Physical layout on this desk: the laptop panel (eDP-1, the 240 Hz one) sits on
# the LEFT, the external MSI on the RIGHT. `preferred` picked the wrong mode on
# both — 60 Hz on a 240 Hz panel and 60 Hz on a monitor that does 100 — and
# `auto` placed them in connector order, which put the MSI on the left. Both are
# pinned explicitly now.
#
# eDP-1 at scale 1.6 gives a 1600x900 logical size (2560/1.6 and 1440/1.6 are
# both integers, so no fractional-scaling blur), which is why the MSI starts at
# x=1600 and not x=2560.
monitor = eDP-1, 2560x1440@240, 0x0, 1.6
monitor = HDMI-A-1, 1920x1080@100, 1600x0, 1

# Anything else that gets plugged in later lands to the right of the MSI.
monitor = , preferred, auto-right, 1


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$browser = brave-origin


#################
### AUTOSTART ###
#################

# Noctalia v5. `noctalia` is the v5 binary (v4 shipped `noctalia-shell`).
# The home-manager systemd unit is deliberately disabled so this is the only
# thing that launches the shell.
exec-once = noctalia

# Noctalia's own wallpaper module is disabled (it mis-sizes the surface at
# fractional monitor scales — see ../../wallpaper.nix). swww draws the
# background; wallpaper-rotate sets the first image and then reshuffles every
# 900s, replacing Noctalia's [wallpaper.automation].
exec-once = swww-daemon
exec-once = wallpaper-rotate --watch

# The starter also auto-launched steam, heroic, lm-studio, signal-desktop and
# more onto fixed workspaces. Removed: several of those are not installed, and
# launching a game client at every login is rarely what you want. Add back
# selectively, e.g.:
# exec-once = [workspace 8 silent] vesktop


#############################
### ENVIRONMENT VARIABLES ###
#############################

# Cursor. The theme names have to be repeated here rather than left to
# home-manager's home.pointerCursor (../../gtk.nix): that module only exports
# them through home.sessionVariables, which land in the shell profile, and SDDM
# execs Hyprland directly without going through a login shell. Keep these four
# values identical to the ones in gtk.nix.
#
# Both variables are set because the two cursor stacks coexist: XCURSOR_* is
# what XWayland and older toolkits read, HYPRCURSOR_* is Hyprland's own vector
# format, which is what keeps the pointer sharp on eDP-1 at scale 1.6.
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

# NVIDIA drives the displays here. The only setting that genuinely matters is
# nvidia_drm.modeset=1, which gpu.nix sets via hardware.nvidia.modesetting.
# The variables below are the ones people commonly add; they are left commented
# because each has a real downside and none is needed by default:
#   GBM_BACKEND=nvidia-drm            -> known to crash Firefox/Chromium (Brave)
#   LIBVA_DRIVER_NAME + NVD_BACKEND   -> only if you install nvidia-vaapi-driver
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = true # lets CS2 benefit from immediate mode; opt in per-window below

    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Window groups: several windows sharing one slot, with a tab bar along the top
# and only one visible at a time. This is the thing Caelestia had on SUPER+, —
# it was never in this config, so the binds below add it (SUPER+G, matching
# Mod+G in ../niri/config.kdl so the habit works in both sessions).
#
# Colours are deliberately absent. Noctalia's hyprland template writes a full
# `group` block into noctalia.conf — including groupbar col.active/col.inactive
# — and that file is sourced at the very bottom, so anything set here would be
# overridden anyway. Only geometry and behaviour belong in this block.
group {
    auto_group = false # only group when asked, never automatically

    groupbar {
        enabled = true
        height = 18
        font_size = 10
        render_titles = true
        gradients = true
        scrolling = true # scroll on the bar to change tab
    }
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # swww owns the wallpaper (see ../../wallpaper.nix)
    disable_hyprland_logo = true
    vfr = true # don't redraw a static screen; meaningful on a laptop
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Noctalia v5 IPC. v4 used `noctalia-shell ipc call <panel> <verb>`;
# v5 uses `noctalia msg <verb> [args]`. Full list: `noctalia msg --help`.
$ipc = noctalia msg

# --- Noctalia panels ---
bind = $mainMod, D,      exec, $ipc panel-toggle launcher
bind = $mainMod, SPACE,  exec, $ipc panel-toggle launcher
bind = $mainMod, F1,     exec, $ipc panel-toggle control-center
bind = $mainMod, F2,     exec, $ipc settings-toggle
bind = $mainMod, F3,     exec, $ipc panel-toggle clipboard
bind = $mainMod, F4,     exec, $ipc panel-toggle session
# Was `$ipc panel-toggle wallpaper`, which opened onto nothing: Noctalia's
# wallpaper module is disabled, so its panel has no module to drive. swww owns
# the background now, and `wallpaper-rotate` with no arguments picks one random
# image and applies it — the same thing the panel's shuffle button did.
bind = $mainMod, W,      exec, wallpaper-rotate
bind = $mainMod, L,      exec, $ipc session lock
bind = ALT,      Tab,    exec, $ipc window-switcher
bind = , Print, exec, $ipc screenshot-region
bind = SHIFT, Print, exec, $ipc screenshot-fullscreen
# Region capture that opens in satty to annotate, then puts the result back on
# the clipboard. Same key as Mod+Print in ../niri/config.kdl; the script lives
# in ../../apps.nix and explains why it is not the default for every capture.
bind = $mainMod, Print, exec, screenshot-annotate

# --- Apps ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, B,      exec, $browser
bind = $mainMod, K,      exec, kate

# --- Window management ---
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, F, fullscreen,

# Groups: stack windows into one slot with a tab bar on top. See the `group`
# block above. SUPER+G is the same key as Mod+G in ../niri/config.kdl, which
# does the equivalent there (tabbed columns).
bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
# Move a window out of the group, or pull the neighbour in. dwindle already
# splits automatically, so these only matter once a group exists.
bind = $mainMod SHIFT, G, moveoutofgroup

# The starter also bound joplin-desktop, zeditor and `wofi --show drun`.
# All three were removed: none of them is installed, so the binds were dead
# keys, and Noctalia's own launcher replaces wofi.

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Media & hardware keys, all handled by Noctalia so the OSD shows up ---
bindel = , XF86AudioRaiseVolume,  exec, $ipc volume-up
bindel = , XF86AudioLowerVolume,  exec, $ipc volume-down
bindel = , XF86AudioMute,         exec, $ipc volume-mute
bindel = , XF86AudioMicMute,      exec, $ipc mic-mute
bindel = , XF86MonBrightnessUp,   exec, $ipc brightness-up
bindel = , XF86MonBrightnessDown, exec, $ipc brightness-down

# ASUS ROG keyboard backlight (this laptop exposes asus::kbd_backlight).
# Noctalia drives the LED directly and shows an OSD for it.
bindel = , XF86KbdBrightnessUp,   exec, $ipc keyboard-backlight-up
bindel = , XF86KbdBrightnessDown, exec, $ipc keyboard-backlight-down

# Fn+F5 cycles the ASUS platform profile (quiet / balanced / performance).
# asusd owns that key at the firmware level, so nothing is bound here — but
# this is the manual equivalent if you ever want it on another key:
# bind = $mainMod, F5, exec, asusctl profile -n

# Noctalia has no media-transport IPC verb, so these stay on playerctl
# (installed in desktops.nix).
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Noctalia's Settings window (verified app id: dev.noctalia.Noctalia)
windowrule = float, class:^(dev\.noctalia\.Noctalia)$
windowrule = size 1080 920, class:^(dev\.noctalia\.Noctalia)$
windowrule = center, class:^(dev\.noctalia\.Noctalia)$

# Tearing lowers input latency in CS2. It is scoped to the game only, because
# general = allow_tearing just permits it; each window must opt in.
windowrule = immediate, class:^(cs2)$

# Every Noctalia surface uses a noctalia-* layer namespace (bar, panels,
# notifications, osd, dock, lockscreen, ...), so one prefix rule covers them.
layerrule = blur, ^(noctalia-.*)$
layerrule = ignorealpha 0.5, ^(noctalia-.*)$
layerrule = noanim, ^(noctalia-.*)$


##############
### THEMING ##
##############

# Noctalia's `hyprland` template (theme.templates.builtin_ids in ../../noctalia.nix)
# renders the active palette into noctalia.conf next to this file and overrides
# the border colours set in `general` above — which is why this include has to
# be last.
#
# The line is written by hand rather than left to the template's apply.sh: that
# script appends it itself, and this file lives in the git repo (config/hypr is
# symlinked out of the store by home.nix), so letting it edit the file would
# produce an untracked diff on first run. Its guard is
# `grep -qE 'source\s*=.*noctalia\.conf'`, which this line satisfies, so it
# now finds the include already present and leaves the file alone.
#
# noctalia.conf itself is generated and gitignored. If it is missing, Hyprland
# logs a "source file doesn't exist" error and carries on with the colours
# above; `noctalia msg templates-apply` recreates it.
source = ~/.config/hypr/noctalia.conf
